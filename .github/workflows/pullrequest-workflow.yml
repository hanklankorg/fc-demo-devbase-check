name: Pull Request Workflow
# Forge CI owns the lint and security gate. The repository's own linters and
# its Bats tests run in the lint and test jobs below; the orchestrator never
# runs them. Require all three as status checks.
on: # yamllint disable-line rule:truthy
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pr-checks:
    uses: hanklankorg/fc-forge-ci/.github/workflows/pullrequest-orchestrator.yml@d33ea2bd2260bad172b2af3a79d2a2f066dfc293 # v0.90.0
    permissions:
      actions: read
      contents: read
    secrets:
      # Optional: uploads lint security findings (SARIF) to Code Scanning.
      CODE_SCANNING_TOKEN: ${{ secrets.CODE_SCANNING_TOKEN }}
    with:
      # The full commit the uses: ref above names; every job of the route runs
      # the CLI built in this run from exactly this commit.
      forge-ci-binary-ref: d33ea2bd2260bad172b2af3a79d2a2f066dfc293
      # No buildable artifacts - this is a linting toolkit
      project-type: meta
      lint-engine: nanolinter
      # The lint image, pinned by digest: the plan job refuses a tag.
      nanolinter-image: ghcr.io/hanklankorg/nanolinter-core@sha256:a76ab1b657f133a684b2ab1b94a7bdcb02e2d2c3ba7a502916c5319b9730b4cd
      # Pinned by digest and admitted before any job runs; replace FIXME with
      # the digests of the release you call (docs/runtime-images.md).
      runtime-image: ghcr.io/hanklankorg/fc-forge-ci/forge-ci-runtime-base@sha256:9864c261c1b2f71d46eac2520f2e66de6b1ceb03c50f8d91acd19ddbccdd53e8 # FIXME v0.90.0 digest
      canonical-builder-image: ghcr.io/hanklankorg/fc-forge-ci/forge-ci-runtime-go-1.27@sha256:d617197ad72db4c7a40e8d9727bcef523218b13b1f59c85b046aa5d9bb60d2e5 # FIXME v0.90.0 digest
      enforce-lint: true
      enforce-vulnerabilities: false
  # The repository linting itself with its own linters (just + mise): commits,
  # secrets, YAML, Markdown, shell, Actions, licences and containers.
  lint:
    name: "Lint: devbase-check"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Fetch base branch for PR
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$BASE_REF":"$BASE_REF"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0
      - name: Reset install-time working tree changes
        run: git checkout -- .
      - name: Run linting
        run: just lint-all
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0
      - name: Run tests
        run: just test
